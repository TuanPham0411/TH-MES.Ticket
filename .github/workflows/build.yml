name: Build, test and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/app_test
      - name: Prepare checksummed release, without deploying
        run: bash ci/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: th-mes-ticket-release-${{ github.sha }}
          retention-days: 30
          path: |
            work/*.tar.gz
            work/*.sha256
  image:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [runtime]
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .

          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/tuanpham0411/th-mes-ticket:${{ github.sha }}
            ghcr.io/tuanpham0411/th-mes-ticket:latest
          cache-from: type=gha,scope=th-mes-ticket-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=th-mes-ticket-${{ matrix.target }}
