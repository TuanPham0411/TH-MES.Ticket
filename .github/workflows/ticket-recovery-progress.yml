name: Inspect isolated Ticket recovery
on:
  push:
    branches: [ops/ticket-recovery-progress]
    paths: ['.github/workflows/ticket-recovery-progress.yml']
permissions: {contents: read}
jobs:
  progress:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Read connection states without SQL or row contents
        run: |
          docker ps --format '{{.Names}} {{.Status}}'
          docker exec ticket-database-1 psql -X -U postgres -d postgres -At -c "SELECT json_build_object('database',datname,'state',state,'waitType',wait_event_type,'waitEvent',wait_event) FROM pg_stat_activity WHERE datname LIKE 'th_recovery_ticket_%'"
          docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}'
          python3 - <<'PY'
          import subprocess,json,pathlib
          result=subprocess.run(['lslocks','--json','-o','PID,COMMAND,TYPE,MODE,PATH'],capture_output=True,text=True)
          for record in json.loads(result.stdout).get('locks',[]):
              if str(record.get('path','')).endswith('/th-platform/deploy.lock'):
                  process=pathlib.Path('/proc')/str(record['pid'])/'cmdline'
                  parts=process.read_bytes().split(b'\\0')
                  print(json.dumps({'lock':record,'program':pathlib.Path(parts[0].decode()).name,'entry':pathlib.Path(parts[1].decode()).name if len(parts)>1 else ''}))
          PY
          for url in https://ticket.th.io.vn/api/health https://ticket.th.io.vn/ https://th.io.vn/api/health https://ai.th.io.vn/api/ready; do
            status="$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")"
            printf '%s %s\\n' "$url" "$status"
          done
          python3 - <<'PY'
          import subprocess,re,json,pathlib
          for url in ['http://127.0.0.1:8082/api/health','http://127.0.0.1/api/health','http://[::1]/api/health','https://ticket.th.io.vn/']:
              command=['curl','--noproxy','*','-g','-sS','--max-time','10','-H','Host: ticket.th.io.vn','-w','\\nSTATUS:%{http_code}',url]
              result=subprocess.run(command,capture_output=True,text=True)
              title=re.search(r'<title>(.*?)</title>',result.stdout,re.S)
              status=re.search(r'STATUS:(\\d+)',result.stdout)
              print(json.dumps({'url':url,'status':status.group(1) if status else None,'title':title.group(1) if title else None}))
          for path in pathlib.Path('/etc/nginx/sites-enabled').glob('*'):
              try:content=path.read_text()
              except OSError:continue
              print(json.dumps({'nginxFile':str(path),'hosts':re.findall(r'server_name\\s+([^;]+);',content),'listen':re.findall(r'listen\\s+([^;]+);',content)}))
          PY
